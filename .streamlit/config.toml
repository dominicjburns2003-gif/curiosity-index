# Curiosity Index - the app's look. Streamlit reads this file automatically.
# Colours match the charts: blue for the company, a warm off-white background.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"
borderColor = "#e4e3df"
showWidgetBorder = true
baseRadius = "0.6rem"

[browser]
gatherUsageStats = false
