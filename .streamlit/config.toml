# Curiosity Index - the app's look. Streamlit reads this file automatically.
# Light grey page with white cards, dark navy text, blue accents matching the
# charts, and the Inter typeface.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f3f4f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f1b2d"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
borderColor = "#e3e6eb"
showWidgetBorder = true
baseRadius = "0.6rem"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"  # hide Streamlit's developer menu for visitors
